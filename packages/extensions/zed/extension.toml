id = "deeprise"
name = "OpenCode"
description = "The open source coding agent."
version = "1.14.31"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/deeprise"

[agent_servers.deeprise]
name = "OpenCode"
icon = "./icons/deeprise.svg"

[agent_servers.deeprise.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/deeprise/releases/download/v1.14.31/deeprise-darwin-arm64.zip"
cmd = "./deeprise"
args = ["acp"]

[agent_servers.deeprise.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/deeprise/releases/download/v1.14.31/deeprise-darwin-x64.zip"
cmd = "./deeprise"
args = ["acp"]

[agent_servers.deeprise.targets.linux-aarch64]
archive = "https://github.com/anomalyco/deeprise/releases/download/v1.14.31/deeprise-linux-arm64.tar.gz"
cmd = "./deeprise"
args = ["acp"]

[agent_servers.deeprise.targets.linux-x86_64]
archive = "https://github.com/anomalyco/deeprise/releases/download/v1.14.31/deeprise-linux-x64.tar.gz"
cmd = "./deeprise"
args = ["acp"]

[agent_servers.deeprise.targets.windows-x86_64]
archive = "https://github.com/anomalyco/deeprise/releases/download/v1.14.31/deeprise-windows-x64.zip"
cmd = "./deeprise.exe"
args = ["acp"]
